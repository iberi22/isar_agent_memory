name: Release on merge (tag + GitHub Release)

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Read current and previous versions
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PREV=$(git show HEAD^:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREV" >> $GITHUB_OUTPUT
          echo "📦 Current version: $CURRENT"
          echo "📦 Previous version: $PREV"

      - name: Check if version changed
        id: check
        run: |
          if [ "${{ steps.ver.outputs.previous }}" == "${{ steps.ver.outputs.current }}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version unchanged; skipping release."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed: ${{ steps.ver.outputs.previous }} → ${{ steps.ver.outputs.current }}"
          fi

      - name: Create and push tag
        if: steps.check.outputs.changed == 'true'
        env:
          TAG: v${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists. Skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag: $TAG"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.changed == 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.current }}"
          
          # Extract section for this version from CHANGELOG.md
          awk -v ver="$VERSION" '
            BEGIN { found=0; first_heading=0 }
            /^## / {
              if (found && first_heading) exit;
              if ($0 ~ ver) { found=1; first_heading=1; next }
            }
            found && first_heading { print }
          ' CHANGELOG.md > release_notes.md
          
          # Add link to full changelog if notes are too short or empty
          if [ ! -s release_notes.md ] || [ $(wc -l < release_notes.md) -lt 3 ]; then
            echo "No detailed release notes found in CHANGELOG.md for version $VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi
          
          echo "📝 Release notes extracted for version $VERSION"
          echo "📄 Preview:"
          head -n 10 release_notes.md

      - name: Determine if prerelease
        if: steps.check.outputs.changed == 'true'
        id: prerelease
        run: |
          VERSION="${{ steps.ver.outputs.current }}"
          if echo "$VERSION" | grep -qE '(alpha|beta|rc|dev|pre)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "🏷️  Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "🏷️  Detected stable release: $VERSION"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.current }}
          name: v${{ steps.ver.outputs.current }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
