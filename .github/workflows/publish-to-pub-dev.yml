name: Publish to pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose 'dry-run' or 'publish'"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    # Only run for published releases (not drafts) or manual workflow dispatch
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify package
        run: dart pub publish --dry-run

      - name: Check if publish should proceed
        id: should_publish
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" == "dry-run" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Dry-run mode - skipping actual publish"
          elif [ "${{ github.event_name }}" == "release" ]; then
            # Check if this is a prerelease
            if [ "${{ github.event.release.prerelease }}" == "true" ]; then
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "⚠️  Prerelease detected - skipping publish to pub.dev"
              echo "💡 To publish prereleases, use workflow_dispatch with mode=publish"
            else
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "✅ Stable release detected - will publish to pub.dev"
            fi
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "✅ Manual publish requested"
          fi

      - name: Publish to pub.dev
        if: steps.should_publish.outputs.publish == 'true'
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
        run: |
          if [ -n "$PUB_CREDENTIALS_JSON" ]; then
            # Create credentials directory if it doesn't exist
            mkdir -p ~/.config/dart
            # Write credentials to file
            echo "$PUB_CREDENTIALS_JSON" > ~/.config/dart/pub-credentials.json
            chmod 600 ~/.config/dart/pub-credentials.json
            echo "✅ Using stored pub.dev credentials"
            dart pub publish --force
          else
            echo "❌ ERROR: PUB_CREDENTIALS_JSON secret not configured"
            echo ""
            echo "To publish to pub.dev, you need to set up credentials:"
            echo "1. Run locally: dart pub login"
            echo "2. Copy contents of ~/.config/dart/pub-credentials.json"
            echo "3. Add as GitHub secret: PUB_CREDENTIALS_JSON"
            echo ""
            echo "See .github/PUB_CREDENTIALS_SETUP.md for detailed instructions"
            echo ""
            echo "⚠️  Skipping publish to avoid hanging on OAuth prompt"
            exit 1
          fi

      - name: Publish summary
        if: steps.should_publish.outputs.publish == 'true'
        run: |
          echo "### 🚀 Package Published to pub.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: isar_agent_memory" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View on pub.dev: https://pub.dev/packages/isar_agent_memory" >> $GITHUB_STEP_SUMMARY

      - name: Dry-run summary
        if: steps.should_publish.outputs.publish == 'false'
        run: |
          echo "### ✅ Dry-run Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package validation succeeded but publish was skipped:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "- Reason: Prerelease version detected" >> $GITHUB_STEP_SUMMARY
            echo "- To publish: Use workflow_dispatch with mode=publish" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Reason: Manual dry-run mode" >> $GITHUB_STEP_SUMMARY
          fi
