name: Publish to pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Release on merge (tag + GitHub Release)"
    types:
      - completed

permissions:
  contents: read

jobs:
  info:
    name: Debug context
    runs-on: ubuntu-latest
    steps:
      - name: Print context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run.conclusion=${{ github.event.workflow_run.conclusion || 'n/a' }}"
          if [ -n "${{ secrets.PUB_CREDENTIALS_JSON }}" ]; then echo "PUB_CREDENTIALS_JSON: present"; else echo "PUB_CREDENTIALS_JSON: missing"; fi

  publish:
    if: >
      ${{
        secrets.PUB_CREDENTIALS_JSON != '' &&
        (
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Configure pub.dev credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.pub-cache
          cat > ~/.pub-cache/credentials.json <<'EOF'
          ${{ secrets.PUB_CREDENTIALS_JSON }}
          EOF
          chmod 600 ~/.pub-cache/credentials.json

      - name: Dry-run publish
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish -f

  missing-secret:
    if: >
      ${{
        secrets.PUB_CREDENTIALS_JSON == '' &&
        (
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Missing pub.dev secret
        run: |
          echo "PUB_CREDENTIALS_JSON no está configurado como secret del repositorio."
          echo "Añade ~/.pub-cache/credentials.json como secret PUB_CREDENTIALS_JSON en Settings → Secrets and variables → Actions."
          exit 1
