name: Publish to pub.dev

on:
  push:
    branches:
      - ci/fix-publish-workflow-conditions
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "If true, publish to pub.dev; if false, only dry-run"
        required: false
        default: "false"
  workflow_run:
    workflows:
      - "Release on merge (tag + GitHub Release)"
    types:
      - completed

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Sanity echo
        run: echo "Workflow parsed and started successfully"

  info:
    name: Debug context
    runs-on: ubuntu-latest
    steps:
      - name: Print event name
        run: echo "event_name=${{ github.event_name }}"
      - name: Print workflow_run conclusion (when workflow_run)
        if: github.event_name == 'workflow_run'
        run: echo "workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"

  dry_run:
    name: Dry-run (manual or push on fixes branch)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Dry-run publish
        run: dart pub publish --dry-run

  publish:
    name: Publish (release/workflow_run)
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure secret present
        if: ${{ secrets.PUB_CREDENTIALS_JSON == '' }}
        run: |
          echo "PUB_CREDENTIALS_JSON no está configurado como secret del repositorio."
          echo "Añade ~/.pub-cache/credentials.json como secret PUB_CREDENTIALS_JSON en Settings → Secrets and variables → Actions."
          exit 1
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Configure pub.dev credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.pub-cache
          cat > ~/.pub-cache/credentials.json <<'EOF'
          ${{ secrets.PUB_CREDENTIALS_JSON }}
          EOF
          chmod 600 ~/.pub-cache/credentials.json
      - name: Dry-run publish
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish -f
