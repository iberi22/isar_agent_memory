name: Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'tool/benchmark.dart'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Download Test Model
        run: dart run tool/setup_on_device_test.dart

      - name: Run Benchmark
        run: dart run tool/benchmark.dart

      - name: Create Pull Request with Results
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update benchmark report"
          title: "📊 Benchmark Results Update"
          body: |
            Automated benchmark run results.

            See `BENCHMARK_REPORT.md` for details.
          branch: "benchmark-results"
          base: "main"
          delete-branch: true
          add-paths: |
            BENCHMARK_REPORT.md
